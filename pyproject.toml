[project]
name = "resume-tools"
version = "0.1.0"
description = "Local Markdown resume rendering and evidence-based tailoring"
requires-python = ">=3.10"
dependencies = [
    "markdown-it-py>=3,<4",
    "reportlab>=4,<5",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8,<9",
    "pypdf>=5,<7",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
